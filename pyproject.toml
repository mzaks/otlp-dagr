# pyproject.toml — generated by `dagr init`.
#
# Dagr's schema DSL (dagr/dsl.py, dagr/config.py, …) ships with the Dagr tool, not on
# PyPI.  The paths below let editors and type-checkers (Pyright / Pylance, mypy)
# resolve the `from dagr.dsl import ...` imports in schema.py.  `dagr build` and
# `dagr ui` resolve them at runtime regardless of this file.
[project]
name = 'otlp-dagr-schema'
version = "0.0.0"
requires-python = ">=3.9"

[tool.pyright]
extraPaths = ['/Users/mzaks_pro/dev/RethinkingDagr']

[tool.mypy]
mypy_path = '/Users/mzaks_pro/dev/RethinkingDagr'
