# Phase A — OTLP in, Dagr spool out.
#
# This is the shape spec/38 §6.1 argues for: the spool IS the sending queue. There is no
# second in-memory queue in front of it and no bbolt KV underneath it, because an
# append-only doubly-linked DataSink already gives framing, self-description and O(1)
# restart recovery.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

# One spool per signal: a component instance serves one pipeline, and a spool records no
# signal identity on the wire yet (spec/38 D2), so each gets its own path.
exporters:
  dagrfile:
    path: ${SPOOL}
    resume: true
  dagrfile/metrics:
    path: ${WORK}/metrics.dagr
    resume: true
  dagrfile/logs:
    path: ${WORK}/logs.dagr
    resume: true
  dagrfile/profiles:
    path: ${WORK}/profiles.dagr
    resume: true

service:
  telemetry:
    logs:
      level: info
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [dagrfile]
    metrics:
      receivers: [otlp]
      exporters: [dagrfile/metrics]
    logs:
      receivers: [otlp]
      exporters: [dagrfile/logs]
    # profiles is `v1development`: roundtrip.sh runs the collector with
    # --feature-gates=service.profilesSupport.
    profiles:
      receivers: [otlp]
      exporters: [dagrfile/profiles]
