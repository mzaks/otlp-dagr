# ocb/samehost.sh, mode shm: the region the app's shmexporter writes, read in place.
receivers:
  dagrshm:
    directory: ${WORK}/samehost
    interval: ${INTERVAL}
exporters:
  nop:
service:
  telemetry: {logs: {level: warn}, metrics: {level: none}}
  pipelines:
    metrics: {receivers: [dagrshm], exporters: [nop]}
